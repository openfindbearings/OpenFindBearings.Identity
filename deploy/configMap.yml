apiVersion: v1
kind: ConfigMap
metadata:
  name: openfindbearings-identity-config
  namespace: openfindbearings
data:
  openIddict__issuer: "https://<your-identity-domain>"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft_AspNetCore: "Warning"
  Logging__LogLevel__Microsoft_EntityFrameworkCore: "Warning"
  Logging__LogLevel__Microsoft_EntityFrameworkCore_Database_Command: "Error"
  AllowedHosts: "*"
  AllowedOrigins__0: "https://<your-site-domain>"
  AllowedOrigins__1: "https://<your-site-domain>"
  # 改动说明（验证码登录上线）：原型期固定验证码模式，未接真实短信通道前
  # 发码落库固定 123456（不外发），供移动端验证码登录端到端联调；
  # 功能开关不进 Secret。接入真实短信通道时删除这两键即可回到随机码。
  Sms__DevMode: "true"
  Sms__DevFixedCode: "123456"