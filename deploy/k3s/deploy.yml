apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-identity
  namespace: openfindbearings
  labels:
    app: openfindbearings-identity
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openfindbearings-identity
  template:
    metadata:
      labels:
        app: openfindbearings-identity
    spec:
      # 改动说明：dpkeys 为 hostPath，kubelet 不支持对 hostPath 应用 fsGroup；
      # DirectoryOrCreate 建出的目录属 root:0755，而容器以非 root 用户运行，
      # 导致 Data Protection 写密钥 UnauthorizedAccessException（登录页 500）。
      # 用 root 身份的 initContainer 在每次调度时纠正属主，防换节点/目录重建后再踩。
      # 实测容器内 `id` 为 uid=1654(app)（基础镜像自定义用户，非 .NET 默认 APP_UID=10001），
      # 属主必须跟实际 uid 一致；若将来更换基础镜像须同步核对该值。
      # 镜像复用主容器同款 Identity 镜像（节点从 ghcr 拉取必可达；曾试 busybox 因
      # docker.io 国内超时导致 Init:ImagePullBackOff）。runAsUser:0 覆盖镜像默认 USER 1654
      # 以获得 chown 权限；chown 行为与镜像版本无关，tag 漂移无影响。
      initContainers:
      - name: dpkeys-init
        image: ghcr.io/openfindbearings/openfindbearings-identity:latest
        command: ["sh", "-c", "chown -R 1654:1654 /app/dpkeys && chmod 700 /app/dpkeys"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: dpkeys
          mountPath: /app/dpkeys
      containers:
      - name: openfindbearings-identity
        image: ghcr.io/openfindbearings/openfindbearings-identity:latest
        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: POD_NETWORK_CIDR
          value: "10.42.0.0/16"  # 根据实际集群配置
        - name: SERVICE_NETWORK_CIDR
          value: "10.43.0.0/16"
        # 改动说明：Data Protection 密钥持久化目录，避免 Pod 重启导致 OIDC 关联 state / 认证 cookie 解密失效
        - name: DataProtection__KeysPath
          value: "/app/dpkeys"
        envFrom:
        - secretRef:
            name: openfindbearings-identity-secrets
        - configMapRef:
            name: openfindbearings-identity-config
        
        volumeMounts:
        - name: certs
          mountPath: /app/certs
          readOnly: true
        - name: dpkeys
          mountPath: /app/dpkeys
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30  # 容器启动后延迟30秒开始探测
          periodSeconds: 10        # 每10秒探测一次
          timeoutSeconds: 5        # 探测超时时间
          failureThreshold: 3      # 连续失败3次后重启容器
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5   # 启动后5秒开始探测
          periodSeconds: 5         # 每5秒探测一次
          timeoutSeconds: 3
          successThreshold: 1      # 成功1次即认为就绪
          failureThreshold: 3   

      volumes: 
      - name: certs
        secret:
          secretName: openiddict-certs
      # 改动说明：Data Protection 密钥持久卷（hostPath，单副本；DirectoryOrCreate 自动建目录）
      - name: dpkeys
        hostPath:
          path: /opt/openfindbearings/identity/dpkeys
          type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:  
  name: openfindbearings-identity
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-identity
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfindbearings-identity-ingress
  namespace: openfindbearings
  labels:
    name: openfindbearings-identity-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    acme.cert-manager.io/http01-edit-in-place: "true" 
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - auth.abcsxl.com
    secretName: auth.abcsxl.com-tls

  rules:
  - host: "auth.abcsxl.com"
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
               name: openfindbearings-identity
               port:
                 number: 80
