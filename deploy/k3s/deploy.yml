apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfindbearings-identity-deployment
  namespace: openfindbearings
  labels:
    app: openfindbearings-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfindbearings-identity
  template:
    metadata:
      labels:
        app: openfindbearings-identity
    spec:
      containers:
      - name: openfindbearings-identity
        image: ghcr.io/openfindbearings/openfindbearings-identity:v1.0.0
        ports:
        - containerPort: 8080

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: POD_NETWORK_CIDR
          value: "10.42.0.0/16"  # 根据实际集群配置
        - name: SERVICE_NETWORK_CIDR
          value: "10.43.0.0/16"
        envFrom:
        - secretRef:
            name: openfindbearings-identity-secrets
        - configMapRef:
            name: openfindbearings-identity-config
        
        volumeMounts:
        - name: certs
          mountPath: /app/certs
          readOnly: true
        
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30  # 容器启动后延迟30秒开始探测
          periodSeconds: 10        # 每10秒探测一次
          timeoutSeconds: 5        # 探测超时时间
          failureThreshold: 3      # 连续失败3次后重启容器
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5   # 启动后5秒开始探测
          periodSeconds: 5         # 每5秒探测一次
          timeoutSeconds: 3
          successThreshold: 1      # 成功1次即认为就绪
          failureThreshold: 3   

      volumes: 
      - name: certs
        secret:
          secretName: openiddict-certs

---
apiVersion: v1
kind: Service
metadata:  
  name: openfindbearings-identity-service
  namespace: openfindbearings
spec:
  selector:
    app: openfindbearings-identity
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfindbearings-identity-ingress
  namespace: openfindbearings
  labels:
    name: openfindbearings-identity-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    acme.cert-manager.io/http01-edit-in-place: "true" 
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - auth.abcsxl.com
    secretName: auth.abcsxl.com-tls

  rules:
  - host: "auth.abcsxl.com"
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: openfindbearings-identity-service
              port:
                number: 80
